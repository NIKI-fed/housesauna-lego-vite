<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/style.scss">
        <!-- <link rel="stylesheet" href="/css/style.min.css"> -->
        <title>Контактная форма</title>
    </head>

    <body class="pageSection">
      <div class="grid__element">
        <h2 class="heading heading--h2 heading--paddingTop-50">Напишите нам</h2>
        
        <ul class="social social__form">
          <li class="social__item social__item--form">
            <a href="https://t.me/Dombanya1">
              <svg class="social__icon social__icon--tg" width="40" height="40">
                <use href="./img/icons/icon-tg.svg"></use>
              </svg>
            </a>
          </li>
          <li class="social__item social__item--form">
            <a href="#TODO">
              <svg class="social__icon social__icon--wa" width="40" height="40">
                <use href="./img/icons/icon-wa.svg"></use>
              </svg>
            </a>
          </li>
          <li class="social__item social__item--form">
            <a href="https://vk.com/domizkleenogobrusa">
              <svg class="social__icon social__icon--vk" width="40" height="40">
                <use href="./img/icons/icon-vk.svg"></use>
              </svg>
            </a>
          </li>
        </ul>

        <form action="/submit" class="form" method="POST">
          <label for="" class="form__label">
            <input type="text" class="form__input form__input--dark" required>
            <span class="form__placeholder form__placeholder--dark">Ваше имя</span>
          </label>
          <label for="" class="form__label">
            <input placeholder="(ххх) xxx-xx-xx" maxlength="15" type="tel" class="form__input form__input--dark form__input--phone" required>
            <span class="form__placeholder form__placeholder--dark">Ваш телефон</span>
          </label>
          <label for="" class="form__label">
            <input placeholder="example@example.ru" type="email" class="form__input form__input--dark form__input--email" required>
            <span class="form__placeholder form__placeholder--dark">Ваш email (необязательно)</span>
          </label>

          <input type="hidden" name="form_name" value="запросу с общей формы сбора заявок">
          <input type="hidden" name="form_link" value="https://domizkleenogobrusa.ru">

          <div class="checkbox-container">  
            <div style="display: flex">
              <input type="checkbox" id="data-agreement" class="checkbox" required>  
            </div>
            <label for="data-agreement" class="text text--black text--sm text--narrow text--heigth">
              
                Я даю согласие на
                <a href="/agreement/" class="text_form--link" target="_blank">обработку персональных данных</a>
                в&nbsp;соответствии с&nbsp;<a href="/policy/" class="text_form--link" target="_blank">политикой конфиденциальности</a>
              
            </label>  
          </div>

          <button class="form__button--submit">
            Позвоните мне
          </button>
          <p class="text text--black text--sm text--sm-center text--narrow">
            Обработка заявки осуществляется в течение рабочего дня
          </p>
        </form>

      </div>

      <article class="policy policy__close">
        <div class="policy__container">
          <p class="policy__text">Наш сайт использует куки. Продолжая им пользоваться, вы соглашаетесь на обработку персональных данных
            в&nbsp;соответствии с&nbsp;
            <a href="/policy/" class="text_form--link" target="_blank">Политикой конфиденциальности</a>
            и 
            <a href="/agreement/" class="text_form--link" target="_blank">Обработки персональных данных</a>
          </p>
          <button class="form__button--submit policy__button" aria-label="Подтверждение согласия на использование файлов Cookie">Принять</button>
        </div>
      </article>

        <script type="module">
          import('./blocks/form/form.js');
          import('./blocks/policy/policy.js');
        </script>

    </body>
</html>
